name: Build Standalone Windows Executable

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow openpyxl

      - name: Build standalone OpenChromLab.exe
        run: |
          pyinstaller --clean --noconfirm OpenChromLab.spec

      - name: Upload standalone executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenChromLab-Windows-x64
          path: dist/OpenChromLab.exe
          if-no-files-found: error

      - name: Create GitHub Release with Standalone Exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenChromLab.exe
          name: OpenChromLab ${{ github.ref_name }} (Beta)
          draft: false
          prerelease: true
          generate_release_notes: true

